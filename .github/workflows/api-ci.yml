name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
  workflow_dispatch:

env:
  # Nom exact de ton App Service dans Azure (avec ton suffixe s'il y en a un)
  AZURE_WEBAPP_NAME: jobconnect-team2-api

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/jobconnect_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: for f in $(find src tests -name "*.js"); do node --check "$f"; done

      - name: Run tests (login and register)
        run: npm test

  deploy:
    # Déploie seulement depuis main, jamais depuis une pull request
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api
