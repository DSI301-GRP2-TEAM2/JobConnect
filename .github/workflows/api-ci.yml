
name: API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: jobconnect-team2-api

jobs:

  # 1. BUILD
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: for f in $(find src tests -name "*.js"); do node --check "$f"; done

  # 2. TEST
  test:
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/jobconnect_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Code coverage
        run: npm run coverage
  
  # 3. DEPLOY
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy to Azure App Service
        id: azure-deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api

      - name: Verify deployment
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors "${{ steps.azure-deploy.outputs.webapp-url }}/api/health"

