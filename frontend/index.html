<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect - Catalogue des Offres</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="navbar">
      <a href="#" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        JobConnect
      </a>

      <ul class="nav-links">
        <li><button class="nav-btn active">Offres</button></li>
      </ul>

      <div class="auth-zone">
        <div id="user-info" style="display: none;" class="user-badge">
          <span id="user-name">Utilisateur</span>
          <span id="user-role-pill" class="role-pill role-candidat">candidat</span>
          <button class="btn btn-outline btn-sm" onclick="logout()" title="Se déconnecter">Déconnexion</button>
        </div>

        <div id="auth-buttons">
          <button class="btn btn-primary btn-sm" onclick="openLoginModal()">Connexion</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; background: #ffffff; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border);">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span>🌐 <strong>API Backend :</strong></span>
        <input type="text" id="api-url-input" class="form-control" style="width: 250px; padding: 0.25rem 0.5rem; font-size: 0.8rem;" value="http://localhost:8080">
      </div>
      <span style="color: var(--text-muted);">JobConnect Platform</span>
    </div>

    <section id="tab-catalogue" class="tab-content active">
      <div class="section-header">
        <div>
          <h2>Offres d'emploi</h2>
          <p>Consultez la liste des offres publiées et découvrez vos opportunités.</p>
        </div>
        <button class="btn btn-outline btn-sm" onclick="loadOffresPubliees()">Rafraîchir</button>
      </div>

      <div id="offres-grid" class="grid-cards"></div>

      <div id="pagination-container" class="pagination"></div>
    </section>
  </main>

  <div class="modal-overlay" id="login-modal">
    <div class="modal-card" style="max-width: 420px;">
      <button class="modal-close" onclick="closeModal('login-modal')">&times;</button>
      <h3 style="margin-bottom: 1rem; font-size: 1.3rem;">Connexion Candidat</h3>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Adresse e-mail</label>
          <input type="email" id="login-email" class="form-control" required placeholder="nom@exemple.com">
        </div>
        <div class="form-group">
          <label for="login-mdp">Mot de passe</label>
          <input type="password" id="login-mdp" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Se connecter</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <footer>
    <p>JobConnect — DSI301 Team 2</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
