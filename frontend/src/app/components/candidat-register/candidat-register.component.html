<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="form-group">
    <label for="reg-nom">Nom *</label>
    <input type="text" id="reg-nom" class="form-control" formControlName="nom" placeholder="Dupont">
    <p class="reg-error" *ngIf="form.get('nom')?.touched && form.get('nom')?.errors?.['required']">Le nom est obligatoire.</p>
  </div>

  <div class="form-group">
    <label for="reg-prenom">Prénom *</label>
    <input type="text" id="reg-prenom" class="form-control" formControlName="prenom" placeholder="Jean">
    <p class="reg-error" *ngIf="form.get('prenom')?.touched && form.get('prenom')?.errors?.['required']">Le prénom est obligatoire.</p>
  </div>

  <div class="form-group">
    <label for="reg-email">Adresse e-mail *</label>
    <input type="email" id="reg-email" class="form-control" formControlName="email" placeholder="jean.dupont@email.fr">
    <p class="reg-error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['email']">Format d'e-mail invalide.</p>
  </div>

  <div class="form-group">
    <label for="reg-mdp">Mot de passe *</label>
    <input type="password" id="reg-mdp" class="form-control" formControlName="mdp" placeholder="8 caractères minimum">
    <p class="reg-error" *ngIf="form.get('mdp')?.touched && form.get('mdp')?.errors?.['minlength']">Au moins 8 caractères.</p>
    <p class="reg-error" *ngIf="form.get('mdp')?.touched && form.get('mdp')?.errors?.['maxlength']">72 caractères maximum.</p>
  </div>

  <div class="form-group">
    <label for="reg-mdp2">Confirmation du mot de passe *</label>
    <input type="password" id="reg-mdp2" class="form-control" formControlName="mdpConfirmation" placeholder="Répétez le mot de passe">
    <p class="reg-error" *ngIf="form.get('mdpConfirmation')?.touched && form.get('mdpConfirmation')?.errors?.['required']">La confirmation est obligatoire.</p>
  </div>

  <p *ngIf="errorMsg" style="color: var(--danger); font-size: 0.88rem; margin-top: 0.5rem;">{{ errorMsg }}</p>

  <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" [disabled]="submitting">
    {{ submitting ? 'Création...' : 'Créer mon compte' }}
  </button>
</form>
