<header>
  <div class="navbar">
    <a href="#" class="brand" (click)="onRetourCatalogue()">
      <span class="brand-box">JC</span>
      <span class="brand-name">JobConnect</span>
    </a>

    <ul class="nav-links" *ngIf="!authService.isEntreprise()">
      <li><button class="nav-tab" [class.active]="currentView === 'catalogue' || currentView === 'detail'" (click)="onRetourCatalogue()">Offres</button></li>
      <li><button class="nav-tab inactive">Mes candidatures</button></li>
      <li><button class="nav-tab inactive">Mon profil</button></li>
    </ul>
    <ul class="nav-links" *ngIf="authService.isEntreprise()">
      <li><button class="nav-tab" [class.active]="companyView === 'list'" (click)="companyView = 'list'">Mes offres</button></li>
      <li><button class="nav-tab" [class.active]="companyView === 'form'" (click)="openOffer(null)">Créer une offre</button></li>
    </ul>

    <div class="auth-zone">
      <div *ngIf="authService.currentUser && authService.currentToken" class="user-badge">
        <span class="avatar-circle">{{ getInitials() }}</span>
        <span class="user-fullname">{{ authService.currentUser.prenom || authService.currentUser.nom }}<ng-container *ngIf="authService.currentUser.prenom"> {{ authService.currentUser.nom[0] }}.</ng-container></span>
        <button class="btn btn-outline btn-sm" (click)="authService.logout()">Déconnexion</button>
      </div>

      <div *ngIf="!authService.currentUser || !authService.currentToken">
        <button class="btn btn-primary btn-sm" (click)="authService.openLoginModal()">Connexion</button>
      </div>
    </div>
  </div>
</header>

<main>
  <app-mes-offres *ngIf="authService.isEntreprise() && companyView === 'list'" (edit)="openOffer($event)"></app-mes-offres>
  <app-offre-form *ngIf="authService.isEntreprise() && companyView === 'form'" [offerId]="selectedOfferId"></app-offre-form>
  <app-catalogue *ngIf="!authService.isEntreprise() && currentView === 'catalogue'" (selectOffre)="onSelectOffre($event)"></app-catalogue>
  <app-detail-offre *ngIf="!authService.isEntreprise() && currentView === 'detail' && selectedOffreId" [offreId]="selectedOffreId" (retour)="onRetourCatalogue()"></app-detail-offre>
</main>

<div class="modal-overlay" [class.active]="authService.showModal">
  <div class="modal-card">
    <button class="modal-close" (click)="authService.closeLoginModal()">&times;</button>
    <h3 style="margin-bottom: 1rem; font-size: 1.3rem;">Connexion</h3>
    <form (ngSubmit)="handleLogin()">
      <div class="form-group">
        <label for="login-email">Adresse e-mail</label>
        <input type="email" id="login-email" class="form-control" required placeholder="nom@exemple.com" [(ngModel)]="loginEmail" name="loginEmail">
      </div>
      <div class="form-group">
        <label for="login-mdp">Mot de passe</label>
        <input type="password" id="login-mdp" class="form-control" required placeholder="••••••••" [(ngModel)]="loginMdp" name="loginMdp">
      </div>
      <p *ngIf="loginError" style="color: var(--danger); font-size: 0.88rem; margin-top: 0.5rem;">{{ loginError }}</p>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Se connecter</button>
    </form>
  </div>
</div>

<footer>
  <p>JobConnect — DSI301 Team 2</p>
</footer>
