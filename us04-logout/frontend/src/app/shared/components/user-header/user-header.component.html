<header class="app-header">
  <div class="brand-block">
    <span class="jc-badge sm">JC</span>
    <span class="wordmark">JobConnect</span>
  </div>

  <nav class="app-nav-links" *ngIf="links().length">
    <a *ngFor="let l of links()" [routerLink]="l.path" [class.active]="l.active">
      {{ l.label }}
    </a>
  </nav>

  <div class="who-block">
    <button type="button" class="who-btn" (click)="toggleMenu()">
      <span class="jc-badge avatar">{{ initials() }}</span>
      <span class="name" *ngIf="user()">{{ user()!.email }}</span>
    </button>

    @if (menuOpen()) {
      <div class="user-menu" (click)="closeMenu()">
        <p class="connected-as">Connecté en tant que {{ user()?.email }}</p>
        <hr>
        <p class="label">Mon espace</p>
        <button type="button" class="logout-btn" (click)="openLogoutModal()">
          Se déconnecter
        </button>
      </div>
    }
  </div>
</header>

@if (modalOpen()) {
  <div class="modal-backdrop" (click)="cancelLogout()">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>Confirmation de déconnexion</h2>
      <p>Voulez-vous vraiment vous déconnecter de JobConnect ? Vous devrez
         vous identifier à nouveau pour accéder à votre espace.</p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" (click)="cancelLogout()" [disabled]="loggingOut()">
          Annuler
        </button>
        <button type="button" class="btn danger" (click)="confirmLogout()" [disabled]="loggingOut()">
          {{ loggingOut() ? 'Déconnexion...' : 'Se déconnecter' }}
        </button>
      </div>
    </div>
  </div>
}
