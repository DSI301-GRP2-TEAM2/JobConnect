name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  pull_request:
    paths:
      - "api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/jobconnect_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: for f in $(find src tests -name "*.js"); do node --check "$f"; done

      - name: Run tests (login and register)
        run: npm test