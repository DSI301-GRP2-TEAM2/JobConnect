name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  pull_request:
    paths:
      - "api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: for f in $(find src -name "*.js"); do node --check "$f"; done